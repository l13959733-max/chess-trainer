name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Draft for Lu to try next to the real app: the branch `preview`, if it exists, goes to /preview/
      - uses: actions/checkout@v4
        id: preview
        continue-on-error: true
        with:
          ref: preview
          path: preview-src
      - if: steps.preview.outcome == 'success'
        working-directory: preview-src
        run: npm ci && npm run build && cp -r dist ../dist/preview
        env:
          BASE_PATH: /${{ github.event.repository.name }}/preview/
          PREVIEW: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
